<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel do Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3ea;--card:#fffaf4;--gold:#b87a2b;--gold2:#8f5a1a;--ink:#3a2414;--mut:#7a6a5c;--line:#ecd9c3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'DM Sans',system-ui,sans-serif;padding-bottom:40px}
.wrap{max-width:680px;margin:auto;padding:0 14px}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line);max-width:680px;margin:auto}
.brand{font:600 22px 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;text-transform:uppercase}
h1{font:600 32px 'Cormorant Garamond',Georgia,serif;margin:16px 0 4px}
.tag{color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--gold2);padding:8px 14px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer}
.chip.on{background:linear-gradient(#c78a3a,#9a6420);color:#fff;border-color:transparent}
.lbl{margin:16px 0 6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.time{font:600 22px 'Cormorant Garamond',Georgia,serif}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:#eee}
.s-pending{background:#fde9c9;color:#8a5200}.s-confirmed{background:#d9efd9;color:#1f6b2a}.s-completed{background:#dde8f7;color:#254a80}.s-cancelled,.s-no_show{background:#f6d9d6;color:#9a2a20}
.card h3{margin:2px 0;font-size:15px}
.card p{margin:2px 0;color:var(--mut);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--gold);background:transparent;color:var(--gold2);padding:7px 12px;border-radius:99px;font:inherit;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.fill{background:linear-gradient(#c78a3a,#9a6420);color:#fff;border-color:transparent}
.btn.red{color:#9a2a20;border-color:#d9a09a}
input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:#fff;margin-bottom:10px;color:var(--ink)}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.err{color:#b3261e;font-size:13px;min-height:18px}
select{appearance:auto}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.chk input{width:auto;margin:0}
.dayrow{display:grid;grid-template-columns:70px 1fr 1fr;gap:6px;margin-bottom:6px;align-items:center}
.dayrow input{margin:0;padding:8px}
.ov{position:fixed;inset:0;background:rgba(40,24,10,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));position:relative}
.sheet h3{margin:0 0 6px;font:600 26px 'Cormorant Garamond',Georgia,serif;padding-right:30px}
.x{position:absolute;right:12px;top:8px;border:0;background:none;font-size:28px;color:var(--mut);cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<script>
const CFG = {
  url: 'https://cjymokyremilztjhgjvy.supabase.co',
  key: 'sb_publishable_aZ_HFtjCQDa1gzYo07OndQ_aHAFgxaF'
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = c => (c / 100).toLocaleString('pt-BR', {style:'currency', currency:'BRL', minimumFractionDigits: c % 100 ? 2 : 0});
const hm = t => new Date(t).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
const LBL = {pending:'Pendente', confirmed:'Confirmado', completed:'Concluído', cancelled:'Cancelado', no_show:'Faltou'};
let T = null, ME = null, V = 'pend', DATA = [], CL = [], Q = '', SV = [], CAT = [], PR = [], OFF = [], WH = [], ST = null;
try { T = JSON.parse(localStorage.getItem('bcs_session')); } catch (e) {}

async function api(path, opt = {}) {
  const r = await fetch(CFG.url + path, {...opt, headers: {apikey: CFG.key, 'Content-Type': 'application/json', ...(T ? {Authorization: 'Bearer ' + T.access_token} : {}), ...(opt.headers || {})}});
  if (r.status === 401 && T) { logout(); throw new Error('Sessão expirada. Entre novamente.'); }
  const d = await r.json().catch(() => null);
  if (!r.ok) throw new Error((d && (d.message || d.msg || d.error_description)) || 'Erro de conexão');
  return d;
}
function logout() { T = null; ME = null; try { localStorage.removeItem('bcs_session'); } catch (e) {} loginView(); }

let MODE = 'in';
function loginView(msg) {
  const up = MODE === 'up';
  $('#app').innerHTML = `<div class="login"><div class="brand" style="text-align:center;margin-bottom:6px">Painel do Studio</div>
    <p class="tag" style="text-align:center;margin:0 0 16px">${up ? 'Crie sua conta e teste grátis por 14 dias' : 'Entre na sua conta'}</p>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username">
    <input id="pw" type="password" placeholder="Senha${up ? ' (mínimo 6 caracteres)' : ''}" autocomplete="${up ? 'new-password' : 'current-password'}" onkeydown="if(event.key==='Enter')login()">
    <div class="err" id="err">${esc(msg || '')}</div>
    <button class="btn fill" style="width:100%;padding:13px;font-size:14px" onclick="login()">${up ? 'Criar conta' : 'Entrar'}</button>
    <p class="tag" style="text-align:center;margin-top:16px"><a href="#" onclick="MODE='${up ? 'in' : 'up'}';loginView();return false">${up ? 'Já tenho conta' : 'Criar uma conta'}</a></p></div>`;
}
async function login() {
  $('#err').textContent = '';
  const body = JSON.stringify({email: $('#em').value.trim(), password: $('#pw').value});
  try {
    const d = await api(MODE === 'up' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password', {method: 'POST', body});
    if (!d.access_token) { MODE = 'in'; loginView('Enviamos um e-mail de confirmação. Confirme e depois entre aqui.'); return; }
    T = {access_token: d.access_token, uid: d.user.id};
    try { localStorage.setItem('bcs_session', JSON.stringify(T)); } catch (e) {}
    await boot();
  } catch (e) {
    $('#err').textContent = /invalid/i.test(e.message) ? 'E-mail ou senha incorretos.' : /already|registered/i.test(e.message) ? 'Este e-mail já tem conta. Use "Já tenho conta".' : e.message;
    T = null;
  }
}
async function boot() {
  try {
    const m = await api(`/rest/v1/studio_members?select=studio_id,display_name,studios(name,slug)&user_id=eq.${T.uid}&active=eq.true`);
    if (!m.length) { onboard(); return; }
    ME = m[0];
    await load(); render();
  } catch (e) { if (T) { logout(); loginView(e.message); } }
}
const slugify = x => x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
function onboard() {
  $('#app').innerHTML = `<header><div class="brand">Novo studio</div><button class="btn" onclick="logout()">Sair</button></header>
    <div class="wrap"><h1>Vamos criar seu studio</h1><p class="tag">Leva menos de um minuto. O teste grátis dura 14 dias.</p>
    <div class="lbl">Nome do studio</div><input id="sn" placeholder="Ex.: Studio Bella" oninput="$('#ss').value=slugify(this.value)">
    <div class="lbl">Endereço do seu site</div><input id="ss" placeholder="studio-bella" oninput="this.value=slugify(this.value)">
    <p class="tag" style="font-size:13px;margin:-4px 0 10px">${esc(location.origin)}/?studio=<b>endereço</b></p>
    <div class="lbl">Seu nome</div><input id="sm" placeholder="Como as clientes vão te ver">
    <div class="err" id="oe"></div><button class="btn fill" style="width:100%;padding:13px;font-size:14px" onclick="createStudio()">Criar meu studio</button></div>`;
}
async function createStudio() {
  $('#oe').textContent = '';
  try {
    await api('/rest/v1/rpc/create_studio_for_current_user', {method: 'POST', body: JSON.stringify({studio_name: $('#sn').value, studio_slug: $('#ss').value, owner_display_name: $('#sm').value})});
    await boot();
  } catch (e) { $('#oe').textContent = e.message; }
}
async function load() {
  if (V === 'svc') { [SV, CAT, PR, OFF] = await Promise.all([api('/rest/v1/services?select=*&order=sort_order.asc,name.asc'), api('/rest/v1/service_categories?select=*&order=sort_order.asc,name.asc'), api('/rest/v1/professionals?select=id,name&active=eq.true&order=sort_order.asc'), api('/rest/v1/professional_services?select=professional_id,service_id,price_is_from')]); return; }
  if (V === 'team') { [PR, WH] = await Promise.all([api('/rest/v1/professionals?select=*&order=sort_order.asc,name.asc'), api('/rest/v1/working_hours?select=*&order=start_time.asc')]); return; }
  if (V === 'me') { ST = (await api('/rest/v1/studios?select=*&id=eq.' + ME.studio_id))[0]; return; }
  if (V === 'cli') { CL = await api('/rest/v1/clients?select=id,full_name,phone,email&order=full_name.asc'); return; }
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const d = n => new Date(t0.getTime() + n * 864e5).toISOString();
  const q = {pend: `&status=eq.pending&starts_at=gte.${d(0)}`, hoje: `&starts_at=gte.${d(0)}&starts_at=lt.${d(1)}`, prox: `&starts_at=gte.${d(0)}&starts_at=lt.${d(14)}`}[V];
  DATA = await api(`/rest/v1/appointments?select=id,studio_id,starts_at,ends_at,status,price_cents,client_note,clients(full_name,phone),services(name),professionals(name)${q}&order=starts_at.asc`);
}
async function go(v) { V = v; try { await load(); } catch (e) { alert(e.message); } render(); }
async function setSt(id, st) {
  if (st === 'cancelled' && !confirm('Cancelar este agendamento?')) return;
  const a = DATA.find(x => x.id === id);
  try {
    await api('/rest/v1/appointments?id=eq.' + id, {method: 'PATCH', headers: {Prefer: 'return=minimal'}, body: JSON.stringify({status: st})});
    if (st === 'completed') await api('/rest/v1/financial_entries', {method: 'POST', headers: {Prefer: 'return=minimal'}, body: JSON.stringify({studio_id: a.studio_id, appointment_id: id, description: ((a.services || {}).name || 'Atendimento') + ' — ' + ((a.clients || {}).full_name || ''), amount_cents: a.price_cents, direction: 'income', paid_at: new Date().toISOString()})});
    await load(); render();
  } catch (e) { alert(e.message); }
}
const waLink = p => { const d = String(p || '').replace(/\D/g, ''); return d ? 'https://wa.me/' + (d.length <= 11 ? '55' + d : d) : ''; };

function card(a) {
  const c = a.clients || {}, w = waLink(c.phone);
  const acts = {pending: [['confirmed','Confirmar','fill'], ['cancelled','Cancelar','red']], confirmed: [['completed','Concluir','fill'], ['no_show','Faltou',''], ['cancelled','Cancelar','red']]}[a.status] || [];
  return `<div class="card"><div class="top"><span class="time">${hm(a.starts_at)} – ${hm(a.ends_at)}</span><span class="badge s-${a.status}">${LBL[a.status]}</span></div>
    <h3>${esc((a.services || {}).name)}</h3>
    <p><b>${esc(c.full_name)}</b> · ${esc(c.phone)}</p>
    <p>${esc((a.professionals || {}).name || 'Sem profissional')} · ${brl(a.price_cents)}</p>
    ${a.client_note ? `<p>Obs.: ${esc(a.client_note)}</p>` : ''}
    <div class="acts">${acts.map(x => `<button class="btn ${x[2]}" onclick="setSt('${a.id}','${x[0]}')">${x[1]}</button>`).join('')}${w ? `<a class="btn" href="${w}" target="_blank" rel="noopener">WhatsApp</a>` : ''}</div></div>`;
}
function agenda() {
  if (!DATA.length) return '<p class="tag">Nenhum agendamento aqui.</p>';
  let last = '', h = '';
  for (const a of DATA) {
    const day = new Date(a.starts_at).toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
    if (day !== last) { h += `<div class="lbl">${esc(day)}</div>`; last = day; }
    h += card(a);
  }
  return h;
}
function clients() {
  const q = Q.toLowerCase(), list = CL.filter(c => (c.full_name + ' ' + (c.phone || '')).toLowerCase().includes(q));
  return `<input placeholder="Buscar cliente" value="${esc(Q)}" oninput="Q=this.value;renderList()"><div id="cl">${clList(list)}</div>`;
}
const clList = list => list.length ? list.map(c => { const w = waLink(c.phone); return `<div class="card"><div class="top"><h3>${esc(c.full_name)}</h3>${w ? `<a class="btn" href="${w}" target="_blank" rel="noopener">WhatsApp</a>` : ''}</div><p>${esc(c.phone || '')} ${esc(c.email || '')}</p></div>`; }).join('') : '<p class="tag">Nenhuma cliente encontrada.</p>';
function renderList() { const q = Q.toLowerCase(); $('#cl').innerHTML = clList(CL.filter(c => (c.full_name + ' ' + (c.phone || '')).toLowerCase().includes(q))); }

function render() {
  const tabs = [['pend','Pendentes'], ['hoje','Hoje'], ['prox','Próximos 14 dias'], ['cli','Clientes'], ['svc','Serviços'], ['team','Equipe'], ['me','Meu studio']];
  $('#app').innerHTML = `<header><div class="brand">${esc((ME.studios || {}).name || 'Studio')}</div><button class="btn" onclick="logout()">Sair</button></header>
    <div class="wrap"><h1>Olá, ${esc(ME.display_name)}</h1><p class="tag" style="margin:0 0 6px;font-size:13px">Seu site: <a href="${esc(location.origin)}/?studio=${esc((ME.studios || {}).slug)}" target="_blank" rel="noopener">${esc(location.origin)}/?studio=${esc((ME.studios || {}).slug)}</a></p>
    <div class="chips">${tabs.map(t => `<button class="chip ${V === t[0] ? 'on' : ''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div>
    ${V === 'cli' ? clients() : V === 'svc' ? svcView() : V === 'team' ? teamView() : V === 'me' ? meView() : agenda()}</div>`;
}
function sheet(html) { $('#sheet').innerHTML = html ? `<div class="ov" onclick="if(event.target===this)sheet()"><div class="sheet"><button class="x" onclick="sheet()">×</button>${html}</div></div>` : ''; }
const hdrs = {Prefer: 'return=minimal'}, rets = {Prefer: 'return=representation'};

// ---------- Serviços ----------
function svcView() {
  const grp = {};
  SV.forEach(x => (grp[x.category_id || ''] = grp[x.category_id || ''] || []).push(x));
  const nm = k => (CAT.find(c => c.id === k) || {}).name || 'Sem categoria';
  return '<button class="btn fill" onclick="svcForm()">+ Novo serviço</button>' + (SV.length ? Object.entries(grp).map(([k, list]) => `<div class="lbl">${esc(nm(k))}</div>` + list.map(x => `<div class="card"><div class="top"><h3>${esc(x.name)}${x.active ? '' : ' <small>(oculto)</small>'}</h3><b>${brl(x.price_cents)}</b></div><p>${x.duration_minutes} min · ${OFF.filter(o => o.service_id === x.id).length} profissional(is)</p><div class="acts"><button class="btn" onclick="svcForm('${x.id}')">Editar</button><button class="btn red" onclick="svcToggle('${x.id}')">${x.active ? 'Ocultar' : 'Mostrar'}</button></div></div>`).join('')).join('') : '<p class="tag" style="margin-top:14px">Nenhum serviço ainda. Toque em "+ Novo serviço" para criar o primeiro.</p>');
}
function svcForm(id) {
  const x = SV.find(v => v.id === id) || {duration_minutes: 60, price_cents: 0};
  const sel = new Set(OFF.filter(o => o.service_id === id).map(o => o.professional_id));
  const from = OFF.some(o => o.service_id === id && o.price_is_from);
  sheet(`<h3>${id ? 'Editar' : 'Novo'} serviço</h3>
    <div class="lbl">Nome</div><input id="f_name" value="${esc(x.name || '')}">
    <div class="lbl">Categoria</div><select id="f_cat" onchange="$('#f_newcat').style.display=this.value==='new'?'block':'none'">${CAT.map(c => `<option value="${c.id}" ${c.id === x.category_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}<option value="new" ${CAT.length ? '' : 'selected'}>+ Nova categoria…</option></select>
    <input id="f_newcat" placeholder="Nome da nova categoria (ex.: Unhas)" style="display:${CAT.length ? 'none' : 'block'}">
    <div class="lbl">Descrição (opcional)</div><input id="f_desc" value="${esc(x.description || '')}">
    <div class="lbl">Duração (minutos)</div><input id="f_dur" type="number" min="5" step="5" value="${x.duration_minutes}">
    <div class="lbl">Preço (R$)</div><input id="f_price" type="number" min="0" step="0.01" value="${(x.price_cents / 100).toFixed(2)}">
    <label class="chk"><input type="checkbox" id="f_from" ${from ? 'checked' : ''}> Mostrar "a partir de"</label>
    <div class="lbl">Quem faz este serviço</div>${PR.map(q => `<label class="chk"><input type="checkbox" class="f_pro" value="${q.id}" ${sel.has(q.id) ? 'checked' : ''}> ${esc(q.name)}</label>`).join('') || '<p class="tag">Cadastre uma profissional na aba Equipe.</p>'}
    <div class="err" id="fe"></div><button class="btn fill" style="width:100%;padding:13px" onclick="svcSave('${id || ''}')">Salvar</button>`);
}
async function svcSave(id) {
  try {
    const name = $('#f_name').value.trim(); if (!name) throw new Error('Informe o nome do serviço.');
    const dur = parseInt($('#f_dur').value, 10); if (!(dur > 0)) throw new Error('Informe a duração em minutos.');
    const price = Math.round(parseFloat($('#f_price').value || '0') * 100);
    let cat = $('#f_cat').value;
    if (cat === 'new') {
      const n = $('#f_newcat').value.trim(); if (!n) throw new Error('Informe o nome da categoria.');
      const r = await api('/rest/v1/service_categories', {method: 'POST', headers: rets, body: JSON.stringify({studio_id: ME.studio_id, name: n, slug: slugify(n) || 'cat-' + Date.now(), sort_order: CAT.length + 1})});
      cat = r[0].id;
    }
    const body = {name, description: $('#f_desc').value.trim() || null, category_id: cat, duration_minutes: dur, price_cents: price};
    const old = SV.find(v => v.id === id); let sid = id;
    if (id) {
      if (old && old.price_cents !== price) await api(`/rest/v1/professional_services?service_id=eq.${id}&price_cents=eq.${old.price_cents}`, {method: 'PATCH', headers: hdrs, body: JSON.stringify({price_cents: null})});
      await api('/rest/v1/services?id=eq.' + id, {method: 'PATCH', headers: hdrs, body: JSON.stringify(body)});
    } else {
      sid = (await api('/rest/v1/services', {method: 'POST', headers: rets, body: JSON.stringify({...body, studio_id: ME.studio_id, sort_order: SV.length + 1})}))[0].id;
    }
    const chosen = [...document.querySelectorAll('.f_pro:checked')].map(c => c.value), from = $('#f_from').checked;
    const had = OFF.filter(o => o.service_id === sid).map(o => o.professional_id);
    for (const q of had.filter(q => !chosen.includes(q))) await api(`/rest/v1/professional_services?service_id=eq.${sid}&professional_id=eq.${q}`, {method: 'DELETE', headers: hdrs});
    for (const q of chosen.filter(q => !had.includes(q))) await api('/rest/v1/professional_services', {method: 'POST', headers: hdrs, body: JSON.stringify({studio_id: ME.studio_id, professional_id: q, service_id: sid, price_is_from: from})});
    if (chosen.length) await api('/rest/v1/professional_services?service_id=eq.' + sid, {method: 'PATCH', headers: hdrs, body: JSON.stringify({price_is_from: from})});
    sheet(); await load(); render();
  } catch (e) { $('#fe').textContent = e.message; }
}
async function svcToggle(id) {
  const x = SV.find(v => v.id === id);
  try { await api('/rest/v1/services?id=eq.' + id, {method: 'PATCH', headers: hdrs, body: JSON.stringify({active: !x.active})}); await load(); render(); } catch (e) { alert(e.message); }
}

// ---------- Equipe e horários ----------
const DAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const t5 = v => String(v).slice(0, 5);
function dayCfg(pid, i) {
  const r = WH.filter(w => w.professional_id === pid && w.weekday === i).sort((a, b) => a.start_time.localeCompare(b.start_time));
  if (!r.length) return {on: false, a: '09:00', b: '18:00', c: '', d: ''};
  return r.length > 1 ? {on: true, a: t5(r[0].start_time), b: t5(r[r.length - 1].end_time), c: t5(r[0].end_time), d: t5(r[1].start_time)} : {on: true, a: t5(r[0].start_time), b: t5(r[0].end_time), c: '', d: ''};
}
function hoursText(pid) {
  const d = DAYS.filter((n, i) => WH.some(w => w.professional_id === pid && w.weekday === i));
  return d.length ? 'Atende: ' + d.join(', ') : 'Sem horários cadastrados: não aparece para agendar';
}
function teamView() {
  return '<button class="btn fill" onclick="proForm()">+ Nova profissional</button>' + PR.map(q => `<div class="card"><div class="top"><h3>${esc(q.name)}${q.active ? '' : ' <small>(oculta)</small>'}</h3></div><p>${esc(q.title || '')}</p><p>${hoursText(q.id)}</p><div class="acts"><button class="btn" onclick="proForm('${q.id}')">Editar</button></div></div>`).join('');
}
function proForm(id) {
  const q = PR.find(v => v.id === id) || {active: true};
  sheet(`<h3>${id ? 'Editar' : 'Nova'} profissional</h3>
    <div class="lbl">Nome</div><input id="p_name" value="${esc(q.name || '')}">
    <div class="lbl">Cargo (ex.: Nail Designer)</div><input id="p_title" value="${esc(q.title || '')}">
    <div class="lbl">Anos de profissão</div><input id="p_years" type="number" min="0" value="${q.experience_years ?? ''}">
    <div class="lbl">Sobre ela (opcional)</div><input id="p_bio" value="${esc(q.bio || '')}">
    <label class="chk"><input type="checkbox" id="p_act" ${q.active ? 'checked' : ''}> Aparece no site e recebe agendamentos</label>
    <div class="lbl">Horário de atendimento</div>
    ${DAYS.map((n, i) => { const c = dayCfg(id, i); return `<div class="dayrow"><label class="chk"><input type="checkbox" id="d${i}" ${c.on ? 'checked' : ''}> ${n}</label><input type="time" id="a${i}" value="${c.a}"><input type="time" id="b${i}" value="${c.b}"><span class="tag" style="font-size:12px">pausa</span><input type="time" id="c${i}" value="${c.c}"><input type="time" id="e${i}" value="${c.d}"></div>`; }).join('')}
    <div class="err" id="fe"></div><button class="btn fill" style="width:100%;padding:13px" onclick="proSave('${id || ''}')">Salvar</button>`);
}
async function proSave(id) {
  try {
    const name = $('#p_name').value.trim(); if (!name) throw new Error('Informe o nome.');
    const rows = [];
    DAYS.forEach((n, i) => {
      if (!$('#d' + i).checked) return;
      const a = $('#a' + i).value, b = $('#b' + i).value, c = $('#c' + i).value, e = $('#e' + i).value;
      if (!a || !b || a >= b) throw new Error('Confira o horário de ' + n + '.');
      if (c && e && a < c && c < e && e < b) rows.push([i, a, c], [i, e, b]); else rows.push([i, a, b]);
    });
    const body = {name, title: $('#p_title').value.trim() || null, bio: $('#p_bio').value.trim() || null, experience_years: $('#p_years').value ? parseInt($('#p_years').value, 10) : null, active: $('#p_act').checked};
    let pid = id;
    if (id) await api('/rest/v1/professionals?id=eq.' + id, {method: 'PATCH', headers: hdrs, body: JSON.stringify(body)});
    else pid = (await api('/rest/v1/professionals', {method: 'POST', headers: rets, body: JSON.stringify({...body, studio_id: ME.studio_id, sort_order: PR.length + 1})}))[0].id;
    await api('/rest/v1/working_hours?professional_id=eq.' + pid, {method: 'DELETE', headers: hdrs});
    if (rows.length) await api('/rest/v1/working_hours', {method: 'POST', headers: hdrs, body: JSON.stringify(rows.map(r => ({studio_id: ME.studio_id, professional_id: pid, weekday: r[0], start_time: r[1], end_time: r[2]})))});
    sheet(); await load(); render();
  } catch (e) { $('#fe').textContent = e.message; }
}

// ---------- Meu studio ----------
function meView() {
  const x = ST || {};
  return `<div class="lbl">Nome do studio</div><input id="m_name" value="${esc(x.name || '')}">
    <div class="lbl">Frase da tela de entrada</div><input id="m_tag" value="${esc(x.tagline || '')}" placeholder="Ex.: Realce sua beleza">
    <div class="lbl">WhatsApp (com DDD)</div><input id="m_wa" value="${esc(x.whatsapp_number || '')}" placeholder="41999998888">
    <div class="lbl">Telefone</div><input id="m_ph" value="${esc(x.phone || '')}">
    <div class="lbl">Instagram (sem @)</div><input id="m_ig" value="${esc(x.instagram_handle || '')}">
    <div class="lbl">Cor da marca</div><input id="m_col" type="color" value="${esc(x.brand_color || '#b87a2b')}" style="height:46px;padding:4px">
    <div class="err" id="fe"></div><button class="btn fill" style="width:100%;padding:13px" onclick="meSave()">Salvar</button>`;
}
async function meSave() {
  const fe = $('#fe'); fe.style.color = '';
  try {
    let wa = $('#m_wa').value.replace(/\D/g, ''); if (wa && wa.length <= 11) wa = '55' + wa;
    const body = {name: $('#m_name').value.trim(), tagline: $('#m_tag').value.trim() || null, whatsapp_number: wa || null, phone: $('#m_ph').value.trim() || null, instagram_handle: $('#m_ig').value.replace('@', '').trim() || null};
    if (!body.name) throw new Error('Informe o nome do studio.');
    const col = $('#m_col').value; if (col !== (ST.brand_color || '#b87a2b')) body.brand_color = col;
    await api('/rest/v1/studios?id=eq.' + ME.studio_id, {method: 'PATCH', headers: hdrs, body: JSON.stringify(body)});
    await load(); fe.style.color = '#1f6b2a'; fe.textContent = 'Salvo!';
  } catch (e) { fe.textContent = e.message; }
}

if (T) boot(); else loginView();
